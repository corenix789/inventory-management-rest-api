name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: inventory_test
          MYSQL_USER: inventory_test
          MYSQL_PASSWORD: test-user-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: inventory_test
      DB_USERNAME: inventory_test
      DB_PASSWORD: test-user-password
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, mbstring, pdo_mysql, zip
          coverage: none

      - name: Generate an ephemeral test application key
        run: echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
          else
            base_sha="$(jq -r '.before' "$GITHUB_EVENT_PATH")"
          fi

          if [[ "$base_sha" =~ ^0+$ ]]; then
            echo "No previous commit is available for an incremental Pint check."
            exit 0
          fi

          mapfile -t php_files < <(git diff --name-only --diff-filter=ACMR "$base_sha" "$GITHUB_SHA" -- '*.php')
          if (( ${#php_files[@]} > 0 )); then
            vendor/bin/pint --test "${php_files[@]}"
          else
            echo "No changed PHP files to check."
          fi

      - name: Run tests
        run: php artisan test
